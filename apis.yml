aid: verdant-robotics
name: Verdant Robotics
description: >-
  Verdant Robotics is an agricultural robotics company building precision
  farming systems for specialty crop growers. Its flagship SharpShooter uses
  "Aim & Apply" technology - machine learning and computer vision that identify
  crops and weeds in real time, build a three-dimensional map of the field, and
  deliver microliter-precise applications directly onto weeds without contacting
  the crop, doing over 240 targeted applications per second. The Robotics-as-a-
  Service platform reduces herbicide use by up to 99% and manual labor costs by
  up to 85% across carrots, leafy greens, cabbage, onions, and grass seed and
  sod production. Founded by leaders from the self-driving vehicle industry and
  commercial agriculture, Verdant is backed by DCVC. This profile was surfaced
  as a DCVC portfolio company; Verdant publishes no public developer API,
  developer portal, or API documentation - its GitHub organization hosts
  robotics tooling and forks (cbuf message serialization, Jetson build scripts,
  YOLO/ultralytics forks) rather than a product API.
